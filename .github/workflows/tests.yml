name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'agentes/**'
      - 'datos/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'agentes/**'
      - 'datos/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarios:
    name: Tests unitarios (sin BigQuery)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            agentes/despliegue/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Solo los tests que no consultan BigQuery, GCS ni Earth Engine.
      # El runner no tiene credenciales GCP, así que los 'integration'
      # fallarían por entorno, no por una regresión real.
      - name: pytest (excluyendo integration)
        run: pytest -m "not integration" -q
