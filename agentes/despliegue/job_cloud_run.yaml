apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: orquestador-avalanchas
  namespace: climas-chileno
  labels:
    sistema: snow-alert
    version: "v3"
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - image: gcr.io/climas-chileno/snow-alert-agentes:latest
              name: orquestador
              resources:
                limits:
                  memory: 4Gi
                  cpu: "2"
              env:
                - name: ID_PROYECTO
                  value: climas-chileno
                - name: DATASET_ID
                  value: clima
                - name: REGION
                  value: us-central1
                # WeatherNext 2 (v15.0+): activo en producción
                - name: USE_WEATHERNEXT2
                  value: "true"
                # LLM: usa Databricks por defecto (token leído desde Secret Manager en runtime)
                # Secret: projects/climas-chileno/secrets/databricks-token
              # Tiempo máximo de ejecución: 120 minutos
              # (5 subagentes × ~22 ubicaciones; a 3600s el pipeline moría por
              # timeout antes de publicar boletin_activo.json y reprocesaba en el
              # reintento — ver setup_scheduler_boletin.sh)
          timeoutSeconds: 7200
          serviceAccountName: funciones-clima-sa@climas-chileno.iam.gserviceaccount.com
      # Reintentos en caso de fallo transitorio
      maxRetries: 1
